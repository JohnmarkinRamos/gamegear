[build]
  command = "npm run build && rm -rf dist && cp -r public dist && rm -f dist/index.php"
  publish = "dist"

[build.environment]
  # composer.lock pins Symfony 8.1 packages, which require PHP >= 8.4.1.
  PHP_VERSION = "8.4"

  # These Laravel config variables hold ordinary values (e.g. "null", "file",
  # "127.0.0.1", "/") that also appear in vendor code and the built assets, so
  # the secrets scanner flags them. APP_KEY and AWS credentials stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "APP_NAME,APP_ENV,APP_DEBUG,APP_URL,APP_LOCALE,APP_FALLBACK_LOCALE,APP_FAKER_LOCALE,APP_MAINTENANCE_DRIVER,APP_MAINTENANCE_STORE,BCRYPT_ROUNDS,LOG_CHANNEL,LOG_STACK,LOG_DEPRECATIONS_CHANNEL,LOG_LEVEL,DB_CONNECTION,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD,SESSION_DRIVER,SESSION_LIFETIME,SESSION_ENCRYPT,SESSION_PATH,SESSION_DOMAIN,BROADCAST_CONNECTION,FILESYSTEM_DISK,QUEUE_CONNECTION,CACHE_STORE,CACHE_PREFIX,MEMCACHED_HOST,REDIS_CLIENT,REDIS_HOST,REDIS_PASSWORD,REDIS_PORT,MAIL_MAILER,MAIL_SCHEME,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM_ADDRESS,MAIL_FROM_NAME,AWS_DEFAULT_REGION,AWS_BUCKET,AWS_USE_PATH_STYLE_ENDPOINT,VITE_APP_NAME"
